spring:
  config:
    # Supports running from either the backend directory or the repository root.
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]

  application:
    name: ${SPRING_APPLICATION_NAME}

  # JPA — the primary DataSource is provided by DataSourceConfig (@Primary bean).
  # Spring Boot JPA auto-configuration picks it up automatically.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}

app:
  frontend-url: ${FRONTEND_URL}
  backend-url: ${BACKEND_URL}

  # Master database — shared infrastructure (tenants, users, roles, tokens).
  # Individual tenant databases are stored in the tenants table and managed
  # dynamically by TenantDataSourceManager.
  datasource:
    master:
      url: ${MASTER_DATABASE_URL}
      username: ${MASTER_DATABASE_USERNAME}
      password: ${MASTER_DATABASE_PASSWORD}
      driver-class-name: ${MASTER_DATABASE_DRIVER_CLASS_NAME}
      maximum-pool-size: ${DB_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${DB_MINIMUM_IDLE:5}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: ${CORS_ALLOWED_METHODS}
    allowed-headers: ${CORS_ALLOWED_HEADERS}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS}

server:
  port: ${SERVER_PORT}