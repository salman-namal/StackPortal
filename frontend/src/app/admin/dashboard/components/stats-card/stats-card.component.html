<article class="stat-card" [class]="'stat-card '+stat.tone"><div class="stat-top"><span class="stat-icon"><app-dashboard-icon [name]="stat.icon" /></span><span class="change">↗ {{ stat.change }}</span></div><p>{{ stat.label }}</p><div class="value-row"><strong>{{ stat.value }}</strong><svg viewBox="0 0 90 28" preserveAspectRatio="none"><polyline [attr.points]="stat.points"></polyline></svg></div></article>
