<div class="dashboard-shell">
  <app-dashboard-sidebar
    [open]="sidebarOpen"
    [collapsed]="sidebarState.collapsed()"
    [userName]="userName"
    (close)="closeSidebar()"
    (collapse)="toggleSidebarCollapse()"
    (logout)="logout()"
  />

  <section class="dashboard-content" [class.sidebar-collapsed]="sidebarState.collapsed()">
    <app-dashboard-navbar
      [userName]="userName"
      (menu)="toggleSidebar()"
      (logout)="logout()"
    />

    <router-outlet />
  </section>
</div>
