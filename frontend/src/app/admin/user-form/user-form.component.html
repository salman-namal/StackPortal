<main class="user-form-page">
  <section class="user-form-card">
    <header><p>USER MANAGEMENT</p><h1>{{ isEdit ? 'Edit user' : 'Create user' }}</h1><span>{{ isEdit ? 'Update account access and profile details.' : 'An email with sign-in credentials will be sent to the user.' }}</span></header>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Name<input type="text" formControlName="name" autocomplete="name" /></label>
      <label>Username<input type="text" formControlName="username" autocomplete="username" /></label>
      <label>Email<input type="email" formControlName="email" autocomplete="email" /></label>
      <ng-container *ngIf="!isEdit"><label>Password<input type="password" formControlName="password" autocomplete="new-password" /></label><label>Confirm password<input type="password" formControlName="confirmPassword" autocomplete="new-password" /></label></ng-container>
      <label>Role<select formControlName="role"><option *ngFor="let role of roles" [value]="role">{{ role }}</option></select></label>
      <label *ngIf="isEdit" class="toggle"><input type="checkbox" formControlName="active" /><span>Active account</span></label>
      <p *ngIf="error" class="error">{{ error }}</p>
      <footer><button type="button" class="secondary" (click)="cancel()">Cancel</button><button type="submit" [disabled]="loading">{{ loading ? 'Saving…' : (isEdit ? 'Save changes' : 'Create user') }}</button></footer>
    </form>
  </section>
</main>
