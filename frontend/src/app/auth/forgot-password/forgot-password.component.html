<app-auth-shell title="Reset your password" subtitle="We’ll help you recover your workspace access.">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="field-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="name@company.com" />
      <div class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
        Enter a valid email.
      </div>
    </div>

    <div *ngIf="error" class="error">{{ error }}</div>
    <div *ngIf="message">{{ message }}</div>

    <button class="btn btn-primary" type="submit" [disabled]="loading">
      {{ loading ? 'Sending...' : 'Send Reset Link' }}
    </button>

    <p class="helper-text">
      <a routerLink="/auth/login">Back to login</a>
    </p>
  </form>
</app-auth-shell>
