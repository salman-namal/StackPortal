<app-auth-shell title="Welcome back" subtitle="Sign in to continue to your workspace.">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="field-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="name@company.com" />
      <div class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
        Enter a valid email.
      </div>
    </div>

    <div class="field-group password-group">
      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Enter your password" />
        <button type="button" class="password-toggle" (click)="togglePassword()" aria-label="Toggle password visibility">
          <span [innerHTML]="showPassword ? '🙈' : '👁'" aria-hidden="true"></span>
        </button>
      </div>
      <div class="error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
        Password is required.
      </div>
    </div>

    <div *ngIf="error" class="error">{{ error }}</div>

    <button class="btn btn-primary" type="submit" [disabled]="loading">
      {{ loading ? 'Logging in...' : 'Sign In' }}
    </button>

    <div class="links-row">
      <a routerLink="/auth/forgot-password">Forgot password?</a>
      <a routerLink="/auth/register">Create account</a>
    </div>
  </form>
</app-auth-shell>
