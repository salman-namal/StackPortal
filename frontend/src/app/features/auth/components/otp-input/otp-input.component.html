<div class="otp-component">
  <div class="otp-grid" role="group" aria-label="Six-digit verification code">
    <input
      *ngFor="let digit of digits; let index = index; trackBy: trackByIndex"
      #otpInput
      class="otp-box"
      type="text"
      [disabled]="disabled"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="6"
      [attr.autocomplete]="index === 0 ? 'one-time-code' : 'off'"
      [attr.aria-label]="'Verification code digit ' + (index + 1) + ' of ' + otpLength"
      [value]="digit"
      (input)="onInput($event, index)"
      (keydown)="onKeydown($event, index)"
      (paste)="onPaste($event, index)"
    />
  </div>

  <div class="otp-resend-row">
    <span class="resend-text">Didn't receive the code?</span>
    <span *ngIf="!canResend" class="timer-badge">Resend code in {{ formatTime(countdown) }}</span>
    <button *ngIf="canResend" type="button" class="resend-btn" [disabled]="disabled" (click)="handleResend()">Resend OTP</button>
  </div>
</div>
