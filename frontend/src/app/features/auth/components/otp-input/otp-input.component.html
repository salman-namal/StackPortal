<div class="otp-component">
  <div class="otp-grid" (paste)="onPaste($event)">
    <input
      *ngFor="let digit of digits; let i = index"
      #otpInput
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      maxLength="1"
      class="otp-box"
      [value]="digit"
      (input)="onInput($event, i)"
      (keydown)="onKeyDown($event, i)"
      [attr.aria-label]="'Digit ' + (i + 1) + ' of 6'"
      autocomplete="off"
    />
  </div>

  <div class="otp-resend-row">
    <span class="resend-text">Didn't receive the code?</span>
    <ng-container *ngIf="!canResend">
      <span class="timer-badge">Resend code in {{ formatTime(countdown) }}</span>
    </ng-container>
    <ng-container *ngIf="canResend">
      <button type="button" class="resend-btn" (click)="handleResend()">Resend OTP</button>
    </ng-container>
  </div>
</div>
