<app-auth-layout>
  <div class="status-page-container">
    <div class="status-badge-icon success">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        <polyline points="9 12 11 14 15 10"></polyline>
      </svg>
    </div>

    <h1 class="status-title">Account Activated!</h1>
    <p class="status-subtitle">Welcome to Stack! Your account has been activated and is ready to use.</p>

    <button type="button" class="btn-primary" routerLink="/auth/login">
      <span>Sign in to your account</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </div>
</app-auth-layout>
