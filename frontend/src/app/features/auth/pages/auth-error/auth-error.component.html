<app-auth-layout>
  <div class="status-page-container">
    <div class="status-badge-icon error">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>

    <h1 class="status-title">Authentication Error</h1>
    <p class="status-subtitle">An unexpected system error occurred during authentication. Please try again or contact support if the issue persists.</p>

    <div class="status-actions">
      <button type="button" class="btn-primary" routerLink="/auth/login">
        <span>Try signing in again</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <a routerLink="/auth/register" class="auth-link text-center">Create a new account</a>
    </div>
  </div>
</app-auth-layout>
