<app-auth-layout title="Reset your access" subtitle="Enter your email and we’ll prepare a secure recovery link for your workspace.">
  <app-auth-card title="Forgot password" subtitle="We’ll send a recovery link to your inbox.">
    <form class="auth-form" [formGroup]="forgotForm" (ngSubmit)="submit()">
      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="you@company.com" />
      </label>

      <button type="submit" class="btn btn--primary" [disabled]="loading()">
        <span *ngIf="!loading()">Send reset link</span>
        <span *ngIf="loading()">Sending…</span>
      </button>

      <p class="auth-link">
        <a routerLink="/auth/login">Back to login</a>
      </p>
    </form>
  </app-auth-card>
</app-auth-layout>
