<app-auth-layout title="Forgot password?" subtitle="No worries! Enter your email and we'll send you a reset link.">
  <form class="auth-form" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" novalidate>
    <!-- Email Field -->
    <div class="form-group">
      <label for="forgot-email">Email address</label>
      <div class="input-container">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input id="forgot-email" type="email" formControlName="email" placeholder="you@company.com" [class.is-invalid]="isControlInvalid('email')" />
      </div>
      <div class="form-error" *ngIf="isControlInvalid('email')">
        <span *ngIf="forgotForm.get('email')?.errors?.['required']">Email address is required</span>
        <span *ngIf="forgotForm.get('email')?.errors?.['email']">Please enter a valid email address</span>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn-primary" [disabled]="loading || redirecting">
      <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      <span>{{ loading ? 'Sending reset link...' : 'Send reset link' }}</span>
      <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </form>

  <!-- Bottom Link -->
  <p class="auth-bottom-text">
    Back to <a routerLink="/auth/login" class="auth-link">sign in</a>
  </p>
</app-auth-layout>
