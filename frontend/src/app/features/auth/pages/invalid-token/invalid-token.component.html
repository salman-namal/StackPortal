<app-auth-layout>
  <div class="status-page-container">
    <div class="status-badge-icon error">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>

    <h1 class="status-title">Invalid or expired link</h1>
    <p class="status-subtitle">The verification or password reset link you used has expired or is invalid. Please request a new link.</p>

    <div class="status-actions">
      <button type="button" class="btn-primary" routerLink="/auth/forgot-password">
        <span>Request new reset link</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <a routerLink="/auth/login" class="auth-link text-center">Back to sign in</a>
    </div>
  </div>
</app-auth-layout>
