<app-auth-layout title="Sign in" subtitle="Welcome back! Please sign in to continue.">
  <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
    <div *ngIf="errorMessage" class="form-error main-error" role="alert">
      {{ errorMessage }}
    </div>

    <!-- Email or Username Field -->
    <div class="form-group">
      <label for="email">Email or Username</label>
      <div class="input-container">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        <input
          id="email"
          type="text"
          formControlName="email"
          placeholder="Email or Username"
          [class.is-invalid]="isControlInvalid('email')"
          autocomplete="username"
        />
      </div>
      <div class="form-error" *ngIf="isControlInvalid('email')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span *ngIf="loginForm.get('email')?.errors?.['required']">Email or username is required</span>
      </div>
    </div>

    <!-- Password Field -->
    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-container">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          [class.is-invalid]="isControlInvalid('password')"
          autocomplete="current-password"
        />
        <button type="button" class="toggle-password-btn" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <div class="form-error" *ngIf="isControlInvalid('password')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
      </div>
    </div>

    <!-- Actions Row: Remember Me & Forgot Password -->
    <div class="auth-row-between">
      <label class="auth-checkbox">
        <input type="checkbox" formControlName="rememberMe" />
        <span>Remember me</span>
      </label>
      <a routerLink="/auth/forgot-password" class="auth-link">Forgot password?</a>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn-primary" [disabled]="loading">
      <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      <span>{{ loading ? 'Signing in...' : 'Sign in' }}</span>
      <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </form>

  <app-social-login label="Continue with Google" [loading]="googleLoading" (googleClick)="handleGoogleLogin()"></app-social-login>

  <!-- Bottom Link -->
  <p class="auth-bottom-text">
    Don't have an account? <a routerLink="/auth/register" class="auth-link">Sign up</a>
  </p>
</app-auth-layout>
