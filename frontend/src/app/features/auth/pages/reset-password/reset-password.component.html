<app-auth-layout title="Reset password" subtitle="Enter your new password.">
  <form class="auth-form" [formGroup]="resetForm" (ngSubmit)="onSubmit()" novalidate>
    <!-- New Password Field & Strength -->
    <div class="form-group">
      <label for="new-password">New password</label>
      <div class="input-container">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input
          id="new-password"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          (input)="onPasswordInput()"
          [class.is-invalid]="isControlInvalid('password')"
        />
        <button type="button" class="toggle-password-btn" (click)="togglePasswordVisibility()">
          <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>

      <!-- Password Strength Visual Bar -->
      <div class="password-strength" *ngIf="resetForm.get('password')?.value">
        <div class="strength-bars">
          <div class="bar" [class.filled-weak]="strengthScore >= 1" [class.filled-medium]="strengthScore >= 2 && strengthScore < 4" [class.filled-strong]="strengthScore >= 4"></div>
          <div class="bar" [class.filled-weak]="strengthScore >= 2" [class.filled-medium]="strengthScore >= 3 && strengthScore < 4" [class.filled-strong]="strengthScore >= 4"></div>
          <div class="bar" [class.filled-medium]="strengthScore >= 3" [class.filled-strong]="strengthScore >= 4"></div>
          <div class="bar" [class.filled-strong]="strengthScore >= 4"></div>
        </div>
        <div class="strength-text">
          <span>Password strength:</span>
          <strong>{{ strengthLabel }}</strong>
        </div>
      </div>

      <div class="form-error" *ngIf="isControlInvalid('password')">
        <span *ngIf="resetForm.get('password')?.errors?.['required']">Password is required</span>
        <span *ngIf="resetForm.get('password')?.errors?.['minlength']">Use at least 8 characters</span>
      </div>
    </div>

    <!-- Confirm Password Field -->
    <div class="form-group">
      <label for="confirm-new-password">Confirm new password</label>
      <div class="input-container">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input
          id="confirm-new-password"
          [type]="showConfirmPassword ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="••••••••"
          [class.is-invalid]="isControlInvalid('confirmPassword') || (submitted && resetForm.errors?.['passwordMismatch'])"
        />
        <button type="button" class="toggle-password-btn" (click)="toggleConfirmPasswordVisibility()">
          <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <div class="form-error" *ngIf="isControlInvalid('confirmPassword') || (submitted && resetForm.errors?.['passwordMismatch'])">
        <span *ngIf="resetForm.get('confirmPassword')?.errors?.['required']">Please confirm your password</span>
        <span *ngIf="resetForm.errors?.['passwordMismatch'] && !resetForm.get('confirmPassword')?.errors?.['required']">Passwords do not match</span>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn-primary" [disabled]="loading">
      <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      <span>{{ loading ? 'Updating password...' : 'Update password' }}</span>
      <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </form>

  <!-- Bottom Link -->
  <p class="auth-bottom-text">
    Back to <a routerLink="/auth/login" class="auth-link">sign in</a>
  </p>
</app-auth-layout>
