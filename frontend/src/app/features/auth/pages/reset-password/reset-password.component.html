<app-auth-layout title="Set a new password" subtitle="Choose a secure password to keep your workspace protected.">
  <app-auth-card title="Reset password" subtitle="Create a fresh password for your account.">
    <form class="auth-form" [formGroup]="resetForm" (ngSubmit)="submit()">
      <label class="field">
        <span>New Password</span>
        <div class="input-group">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="newPassword" placeholder="Enter new password" />
          <button type="button" class="field__toggle" (click)="togglePassword()">{{ showPassword ? 'Hide' : 'Show' }}</button>
        </div>
      </label>

      <label class="field">
        <span>Confirm Password</span>
        <div class="input-group">
          <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword" placeholder="Confirm new password" />
          <button type="button" class="field__toggle" (click)="toggleConfirmPassword()">{{ showConfirmPassword ? 'Hide' : 'Show' }}</button>
        </div>
      </label>

      <button type="submit" class="btn btn--primary" [disabled]="loading()">
        <span *ngIf="!loading()">Reset password</span>
        <span *ngIf="loading()">Resetting…</span>
      </button>
    </form>
  </app-auth-card>
</app-auth-layout>
