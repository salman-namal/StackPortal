<app-auth-layout>
  <div class="status-page-container">
    <div class="status-badge-icon warning">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>

    <h1 class="status-title">Session Expired</h1>
    <p class="status-subtitle">Your session has expired due to inactivity. Please sign in again to continue accessing your account.</p>

    <button type="button" class="btn-primary" routerLink="/auth/login">
      <span>Sign in again</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </div>
</app-auth-layout>
