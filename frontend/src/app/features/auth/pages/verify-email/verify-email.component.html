<app-auth-layout title="Verify your email" [subtitle]="'Enter the 6-digit code sent to ' + userEmail">
  <div class="auth-form">
    <div class="form-error main-error" *ngIf="errorMessage" style="margin-bottom: 1rem; color: #dc3545; padding: 0.75rem; background: #f8d7da; border-radius: 0.375rem; border: 1px solid #f5c2c7;">
      {{ errorMessage }}
    </div>
    <div class="form-success main-success" *ngIf="successMessage" style="margin-bottom: 1rem; color: #0f5132; padding: 0.75rem; background: #d1e7dd; border-radius: 0.375rem; border: 1px solid #badbcc;">
      {{ successMessage }}
    </div>

    <app-otp-input (otpSubmit)="handleOtpSubmit($event)" (resendOtp)="handleResendOtp()"></app-otp-input>

    <!-- Verify Button -->
    <button type="button" class="btn-primary" [disabled]="loading" (click)="verifyCode()">
      <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      <span>{{ loading ? 'Verifying code...' : 'Verify code' }}</span>
      <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>

    <div class="verify-footer-links">
      <!-- <a routerLink="/auth/register" class="auth-link">Change email</a> -->
      <a routerLink="/auth/login" class="auth-link">Back to sign in</a>
    </div>
  </div>
</app-auth-layout>
