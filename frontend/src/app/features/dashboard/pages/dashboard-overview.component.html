<main class="dashboard-main"><app-welcome-banner [name]="userName" /><section class="stats-grid" aria-label="Workspace statistics"><app-stats-card *ngFor="let stat of stats" [stat]="stat" /></section>
  <section class="recent-tenants" *ngIf="isSuperAdmin"><header><div><p>TENANT MANAGEMENT</p><h2>Recent tenants</h2></div><a routerLink="/dashboard/tenants">View all tenants</a></header><p *ngIf="loading">Loading tenant statisticsâ€¦</p><p *ngIf="!loading && !dashboard?.recentTenants?.length">No tenants have been created yet.</p><table *ngIf="dashboard?.recentTenants?.length"><thead><tr><th>Name</th><th>Code</th><th>Status</th><th>Created</th></tr></thead><tbody><tr *ngFor="let tenant of dashboard?.recentTenants"><td>{{tenant.name}}</td><td>{{tenant.code}}</td><td>{{tenant.status}}</td><td>{{tenant.createdAt | date:'mediumDate'}}</td></tr></tbody></table></section>
  <app-dashboard-analytics /></main>
