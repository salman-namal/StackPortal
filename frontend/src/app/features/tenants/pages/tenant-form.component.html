<main class="tenant-form-page"><header><div><p>TENANT MANAGEMENT</p><h1>{{ isEdit ? 'Edit Tenant' : 'Create Tenant' }}</h1><span>{{ isEdit ? 'Update tenant settings and contact information.' : 'Provision a tenant and invite its first administrator.' }}</span></div></header>
  <section class="card"><form (ngSubmit)="submit()" [formGroup]="form">
    <div class="row"><label>Tenant name<input formControlName="name" required /></label><label>Code<input formControlName="code" required pattern="[a-z0-9-]+" /><small *ngIf="isEdit">Immutable after provisioning.</small></label></div>
    <div class="row" *ngIf="!isEdit"><label>Initial admin full name<input formControlName="adminName" required /></label><label>Initial admin email<input formControlName="adminEmail" type="email" required /></label></div>
    <div class="row"><label>Contact email<input formControlName="email" type="email" /></label><label>Website<input formControlName="website" /></label></div>
    <div class="row"><label>Phone<input formControlName="phone" /></label><label>City<input formControlName="city" /></label></div>
    <div class="row"><label>Country<input formControlName="country" /></label><label>Logo URL<input formControlName="logo" /></label></div>
    <div class="row"><label>Status<select formControlName="status"><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select></label></div>
    <div class="actions"><button type="button" (click)="cancel()">Cancel</button><button type="submit" [disabled]="loading">{{ isEdit ? 'Save' : 'Create' }}</button></div><div *ngIf="error" class="error">{{ error }}</div>
  </form></section>
</main>
