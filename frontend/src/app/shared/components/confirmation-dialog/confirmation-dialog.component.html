<ng-container *ngIf="dialog.state$ | async as state"><div class="confirm-backdrop"><section class="confirm-dialog" role="dialog" aria-modal="true"><div [ngClass]="['confirm-icon', state.type]"><svg *ngIf="state.type === 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg><svg *ngIf="state.type === 'warning'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m10.3 3.5-8 14A2 2 0 0 0 4 20.5h16a2 2 0 0 0 1.7-3l-8-14a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg><svg *ngIf="state.type === 'danger'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></svg></div><h2>{{state.title}}</h2><p>{{state.message}}</p><label *ngIf="state.requiredText">Type <strong>{{state.requiredText}}</strong> to confirm<input [(ngModel)]="typed"></label><footer><button type="button" class="cancel" (click)="close()">{{state.cancelText}}</button><button #confirmButton type="button" [ngClass]="['confirm', state.type]" [disabled]="!!state.requiredText && typed !== state.requiredText" (click)="confirm()">{{state.confirmText}}</button></footer></section></div></ng-container>
