<div class="toast-host" aria-live="polite" aria-atomic="true">
  <div *ngFor="let toast of toastService.toasts$ | async" class="app-toast" [class.app-toast--error]="toast.type === 'error'" role="alert">
    <span>{{ toast.message }}</span>
    <button type="button" aria-label="Dismiss notification" (click)="toastService.dismiss(toast.id)">&times;</button>
  </div>
</div>
